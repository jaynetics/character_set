name: tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby: [ '3.0', '3.4', '4.0', 'ruby-head' ]
        include:
          - ruby: 'jruby-9.4'
            java: '21'
          - ruby: 'jruby-10.1.1.0'
            java: '21'
          - ruby: 'jruby-10.1.1.0'
            java: '23'
          - ruby: 'jruby-head'
            java: '25'

    env:
      RUBYOPT: '--enable=frozen-string-literal --debug=frozen-string-literal'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: ${{ startsWith(matrix.ruby, 'jruby') }}
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Test with Rake
        run: bundle exec rake spec:quick
      - name: Test the installed Java gem
        if: ${{ startsWith(matrix.ruby, 'jruby') }}
        run: bundle exec rake java:smoke
      - uses: codecov/codecov-action@v3
        if: ${{ env.CI == '1' && matrix.ruby == '3.4' }} # match version in spec_helper.rb:4
