name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '11 11 14 * *' # at 11:11 am on the 14th of every month

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby: [ '2.4', '2.7', '3.0', '3.4', '4.0', 'ruby-head', 'jruby-head' ]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: ${{ matrix.ruby == 'jruby-head' }}
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install --jobs 4
      - name: Test with Rake
        run: bundle exec rake spec:quick
      - uses: codecov/codecov-action@v3
        if: ${{ env.CI == '1' && matrix.ruby == '3.4' }} # match version in spec_helper.rb:4
