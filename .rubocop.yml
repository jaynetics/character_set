AllCops:
  Exclude:
    - '**/doc/*'
    - '**/pkg/*'
    - '**/spec/ruby-spec/**/*'
    - '**/vendor/**/*' # vendored dependencies
  NewCops: enable
  RubyInterpreters:
    - ruby
    - rake
  TargetRubyVersion: 3.0

Lint/AmbiguousOperatorPrecedence:
  Enabled: false

Lint/AmbiguousRegexpLiteral:
  Enabled: false

Metrics:
  Enabled: false
